# Local sandbox stack: Postgres + FastAPI backend (with scheduler) + nginx-served SPA.
#   make up      -> http://localhost:8686 (UI, API at /api)  |  http://localhost:8600/docs (API direct)
#   Host ports default to uncommon values so they do not clash with Jenkins (8080), other dev servers (8000)
#   or a local PostgreSQL (5432). Override with ACH_WEB_HOST_PORT / ACH_API_HOST_PORT / ACH_DB_HOST_PORT in .env.
name: ach-platform

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ach
      POSTGRES_PASSWORD: ach
      POSTGRES_DB: ach
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host port is only for local DB tools; the backend reaches Postgres on the internal network.
      # Defaults to 5433 so it does not clash with a PostgreSQL already running on 5432.
      - "127.0.0.1:${ACH_DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ach -d ach"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ACH_ENV: sandbox
      ACH_DATABASE_URL: postgresql+psycopg://ach:ach@db:5432/ach
      ACH_SCHEDULER_ENABLED: "true"
      ACH_SCHEDULER_INTERVAL_SECONDS: ${ACH_SCHEDULER_INTERVAL_SECONDS:-60}
      ACH_SEED_DEMO_DATA: ${ACH_SEED_DEMO_DATA:-true}
      ACH_CORS_ORIGINS: http://localhost:${ACH_WEB_HOST_PORT:-8686},http://localhost:5173
      ACH_ITSM_WEBHOOK_URL: ${ACH_ITSM_WEBHOOK_URL:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ACH_API_HOST_PORT:-8600}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${ACH_WEB_HOST_PORT:-8686}:80"

volumes:
  pgdata:
