name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ach
          POSTGRES_PASSWORD: ach
          POSTGRES_DB: ach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ach -d ach_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      ACH_TEST_DATABASE_URL: postgresql+psycopg://ach:ach@localhost:5432/ach_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Byte-compile
        run: python -m compileall -q app
      - name: Tests (Postgres)
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # hashFiles() is not available in job-level `if`, so the lockfile guard sits on each step.
      - name: Frontend not present yet
        if: hashFiles('frontend/package-lock.json') == ''
        working-directory: .
        run: echo "::notice::frontend/package-lock.json not found - skipping frontend build"
      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package-lock.json') != ''
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm ci
      - name: npm run build
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm run build

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform validate
        run: terraform init -backend=false -input=false && terraform validate

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, terraform]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: ach-platform/backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        if: hashFiles('frontend/package-lock.json') != ''
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          build-args: VITE_API_URL=/api
          tags: ach-platform/frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
